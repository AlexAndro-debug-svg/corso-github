<!DOCTYPE html><html><head><meta charset="utf-8"><style>
/*FONTS*/
html,body{margin:0}
.c{width:1200px;height:630px;position:relative;overflow:hidden;background:linear-gradient(135deg,#4338ca 0%,#4f46e5 45%,#6d28d9 100%);font-family:Atk,sans-serif;color:#fff}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.10) 2px,transparent 2px);background-size:28px 28px}
.txt{position:absolute;left:72px;top:84px;width:600px}
.badge{display:inline-block;background:#fde047;color:#1e1b4b;font-weight:700;font-size:24px;letter-spacing:1px;padding:8px 18px;border-radius:999px}

p{font-size:33px;line-height:1.35;margin:0;color:#e0e7ff}
.site{position:absolute;left:72px;bottom:46px;font-size:26px;font-weight:700;color:#c7d2fe}
.art{position:absolute;right:56px;top:70px;width:440px}
.chips{position:absolute;right:48px;top:150px;width:500px;display:flex;flex-direction:column;gap:16px}
.chip{border-radius:18px;padding:16px 22px;font-size:30px;font-weight:700;background:#fff;color:#1f2937;padding-left:40px;box-shadow:inset 16px 0 0 var(--c),0 12px 24px rgba(0,0,0,.18)}
.chip small{font-weight:400;color:#475569;font-size:24px;white-space:nowrap}
.chip{display:flex;align-items:center;gap:14px;padding-top:26px;padding-bottom:26px}.n{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;font-size:26px}.g1{--c:#6d28d9}.g2{--c:#0f766e}.g3{--c:#c2410c}
</style></head><body><div class="c"><div class="dots"></div>
